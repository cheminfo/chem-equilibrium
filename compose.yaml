services:
  equilibrium-cheminfo-org:
    # Use the released image by default. To build from this checkout instead:
    #   docker compose up -d --build
    image: ghcr.io/cheminfo/chem-equilibrium:latest
    build: .
    env_file: .env
    ports:
      - '${PORT:-8080}:80'
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      core: 0
    mem_limit: 512m
    cpus: '0.5'
    pids_limit: 256
    logging:
      options:
        max-size: '5m'
        max-file: '3'
    restart: unless-stopped
