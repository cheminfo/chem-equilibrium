# Behind a Cloudflare Tunnel. No port is published on the host; set TUNNEL_TOKEN
# in .env and point the tunnel at http://equilibrium-cheminfo-org:80.
services:
  equilibrium-cheminfo-org:
    image: ghcr.io/cheminfo/chem-equilibrium:latest
    build: .
    env_file: .env
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      core: 0
    mem_limit: 512m
    cpus: '0.5'
    pids_limit: 256
    logging:
      options:
        max-size: '5m'
        max-file: '3'
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - equilibrium-cheminfo-org
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      core: 0
    mem_limit: 128m
    cpus: '1'
    pids_limit: 64
    logging:
      options:
        max-size: '5m'
        max-file: '3'
    restart: unless-stopped
