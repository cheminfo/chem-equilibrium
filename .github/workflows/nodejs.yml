name: Node.js CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  nodejs:
    # Documentation: https://github.com/zakodium/workflows#nodejs-ci
    uses: zakodium/workflows/.github/workflows/nodejs.yml@nodejs-v1
    with:
      lint-check-types: true
      # The root package is the private workspace root, so packing and
      # installing it proves nothing. `publish-library.yml` packs the real
      # package before publishing it.
      disable-test-package: true

  e2e:
    # Playwright needs a browser, which the shared workflow does not install.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build-lib
      - run: npx playwright install --with-deps chromium
        working-directory: packages/equilibrium.cheminfo.org
      - run: npm run test-e2e
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: packages/equilibrium.cheminfo.org/playwright-report
          retention-days: 7
