# Behind Traefik. Requires an external Docker network named "traefik" with a
# `websecure` entrypoint and a `letsencrypt` certificate resolver.
services:
  equilibrium-cheminfo-org:
    image: ghcr.io/cheminfo/chem-equilibrium:latest
    build: .
    env_file: .env
    networks:
      - default
      - traefik
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.equilibrium-cheminfo-org.rule=Host(`equilibrium.cheminfo.org`)'
      - 'traefik.http.routers.equilibrium-cheminfo-org.entrypoints=websecure'
      - 'traefik.http.routers.equilibrium-cheminfo-org.tls.certresolver=letsencrypt'
      - 'traefik.http.services.equilibrium-cheminfo-org.loadbalancer.server.port=80'
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ulimits:
      core: 0
    mem_limit: 512m
    cpus: '0.5'
    pids_limit: 256
    logging:
      options:
        max-size: '5m'
        max-file: '3'
    restart: unless-stopped

networks:
  traefik:
    external: true
